name: WMS PR CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wms-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: WMS Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: wms_test
          POSTGRES_DB: wms_test
          POSTGRES_PASSWORD: wms_test_only
        ports: ["127.0.0.1:5433:5432"]
        options: >-
          --health-cmd "pg_isready -U wms_test -d wms_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://wms_test:wms_test_only@127.0.0.1:5433/wms_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python unit, shell integration, docs and safety tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.3
          PYTHONPATH=scripts python3 scripts/run_policy_tests.py
          for f in scripts/*.sh; do bash -n "$f"; done
          python3 scripts/validate_docs.py
          python3 scripts/check_public_files.py
      - name: Validate GitHub Actions with verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          WMS_TOOLS_DIR="$RUNNER_TEMP/wms-tools" bash scripts/install-dev-tools.sh
          "$RUNNER_TEMP/wms-tools/actionlint" .github/workflows/*.yml
      - name: Require application entrypoints
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_application.py
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        if: ${{ hashFiles('package.json') != '' }}
        with:
          version: "10.34.7"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ hashFiles('package.json') != '' }}
        with:
          node-version-file: ".node-version"
      - name: Build and test application (DEV01 onward)
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        env:
          WMS_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high
          pnpm check:boundaries
          pnpm lint
          pnpm typecheck
          pnpm db:migrate:test
          pnpm test:unit
          pnpm test:integration
          pnpm test:failures
          if python3 scripts/check_application.py --needs-invariants; then
            pnpm test:invariants
          fi
          pnpm build
      - name: Browser smoke tests (desktop and mobile)
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Build current-head merge evidence
        if: ${{ github.event_name == 'pull_request' }}
        run: python3 scripts/ci_evidence.py
      - name: Preserve merge evidence (data only)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wms-merge-evidence
          path: test-results/merge-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve synthetic test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-01-test-results
          path: test-results/*.json
          if-no-files-found: error
          retention-days: 7
