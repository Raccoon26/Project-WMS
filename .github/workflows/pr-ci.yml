name: WMS PR CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wms-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: WMS Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python unit, shell integration, docs and safety tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 -m unittest discover -s scripts -p 'test_*.py' -v
          for f in scripts/*.sh; do bash -n "$f"; done
          python3 scripts/validate_docs.py
          python3 scripts/check_public_files.py
      - name: Validate GitHub Actions with verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          WMS_TOOLS_DIR="$RUNNER_TEMP/wms-tools" bash scripts/install-dev-tools.sh
          "$RUNNER_TEMP/wms-tools/actionlint" .github/workflows/*.yml
      - name: Require application entrypoints
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_application.py
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        if: ${{ hashFiles('package.json') != '' }}
        with:
          version: '10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ hashFiles('package.json') != '' }}
        with:
          node-version: '24'
      - name: Build and test application (DEV01 onward)
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test:unit
          pnpm test:integration
          pnpm test:failures
          if python3 scripts/check_application.py --needs-invariants; then
            pnpm test:invariants
          fi
          pnpm build
