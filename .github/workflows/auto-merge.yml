# Privileged stage checks only GitHub metadata + trusted main code.
# NEVER checkout, import, execute PR-head code here. Bounded JSON evidence is data, never executable.
name: WMS Guarded Auto Merge
on:
  workflow_run:
    workflows: ["WMS Independent Verification"]
    types: [completed]
permissions:
  actions: read
  contents: write
  pull-requests: write
concurrency:
  group: wms-guarded-merge-main
  cancel-in-progress: false
jobs:
  merge:
    name: Guarded Auto Merge
    if: >-
      ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_run') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      WMS_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id || '0' }}
      PR_NUMBER: ${{ github.event.pull_request.number || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Merge only a current, verified DEV PR
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/auto_merge.py --repo "$WMS_REPO" --run-id "$RUN_ID" --pr-number "$PR_NUMBER"
