name: WMS PR Policy
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled, edited]
    branches: [main]
permissions:
  contents: read
  pull-requests: read
  issues: read
concurrency:
  group: wms-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  policy:
    name: WMS Policy Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      BASE_REPO: ${{ github.repository }}
    steps:
      # Only the trusted base commit. Never checkout/import/evaluate PR code here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Fetch complete API metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          gh api "repos/$BASE_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/meta.json"
          gh api "repos/$BASE_REPO/pulls/$PR_NUMBER/files?per_page=100" --paginate | python3 scripts/slurp_json.py > "$RUNNER_TEMP/files.json"
          gh api "repos/$BASE_REPO/pulls/$PR_NUMBER/reviews?per_page=100" --paginate | python3 scripts/slurp_json.py > "$RUNNER_TEMP/reviews.json"
          gh api "repos/$BASE_REPO/issues/$PR_NUMBER/comments?per_page=100" --paginate | python3 scripts/slurp_json.py > "$RUNNER_TEMP/comments.json"
      - name: Verify policy snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads((Path(os.environ['RUNNER_TEMP'])/'meta.json').read_text())
          if m['head']['sha'] != os.environ['EXPECTED_HEAD']:
              raise SystemExit('Head changed; wait for the current event')
          PY
          python3 scripts/pr_policy.py --metadata "$RUNNER_TEMP/meta.json" --files "$RUNNER_TEMP/files.json" --reviews "$RUNNER_TEMP/reviews.json" --comments "$RUNNER_TEMP/comments.json" --repo "$BASE_REPO"
          gh api "repos/$BASE_REPO/pulls/$PR_NUMBER" --jq .head.sha > "$RUNNER_TEMP/head-after"
          [[ "$(cat "$RUNNER_TEMP/head-after")" == "$EXPECTED_HEAD" ]]
