name: wms-dev
services:
  db:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_USER: wms_dev
      POSTGRES_DB: wms_dev
      POSTGRES_PASSWORD: ${WMS_DEV_PASSWORD:?Run pnpm dev:setup first}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms_dev -d wms_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  pgdata:
